<svg xmlns="http://www.w3.org/2000/svg" viewBox="90 55 350 375" width="100%" height="100%">
  <defs>
    <!-- Soft Realistic 3D Cast Shadow matching original image -->
    <filter id="pc-full-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-10" dy="16" stdDeviation="10" flood-color="#0a1026" flood-opacity="0.65" />
      <feDropShadow dx="-2" dy="6" stdDeviation="4" flood-color="#030712" flood-opacity="0.45" />
    </filter>

    <!-- Royal Blue Front Faces - Enhanced Luminance for High Contrast -->
    <linearGradient id="blueFrontGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Blue Top 3D Bevel Facet - Bright Specular Sheen -->
    <linearGradient id="blueTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe" />
      <stop offset="50%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Blue Left Side 3D Extrusion - Defined without Blackout -->
    <linearGradient id="blueSideGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Bright Vibrant Golden Yellow Front Face -->
    <linearGradient id="yellowFrontGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcc00" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Yellow Top Facet Highlight -->
    <linearGradient id="yellowTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Yellow 3D Bottom/Side Extrusions -->
    <linearGradient id="yellowSideGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
  </defs>

  <g filter="url(#pc-full-shadow)">
    <!-- 3D P Top Bar - Left Extruded Face -->
    <path d="M 125 115 L 145 80 L 155 80 L 138 122 Z" fill="url(#blueSideGrad)" />
    <!-- 3D P Top Bar - Top Bevel -->
    <path d="M 145 80 L 295 80 Q 370 80 375 130 L 335 150 Q 325 118 280 118 L 138 118 Z" fill="url(#blueTopGrad)" />
    <!-- 3D P Top Bar - Front Face -->
    <path d="M 135 118 L 295 118 Q 365 118 365 170 Q 365 220 310 220 L 255 220 L 255 260 L 315 260 Q 405 260 405 170 Q 405 75 295 75 L 135 75 Z" fill="url(#blueFrontGrad)" stroke="#93c5fd" stroke-width="1" stroke-opacity="0.6" />

    <!-- Embossed Bright "PRAYER" Text on Top Bar -->
    <text
      x="170"
      y="104"
      fill="#ffffff"
      font-family="'Montserrat', 'Arial Black', sans-serif"
      font-size="21"
      font-weight="900"
      letter-spacing="2.5"
      transform="rotate(1.5 170 104)"
    >
      PRAYER
    </text>

    <!-- Blue Vertical Stem - Left 3D Extruded Block Shadow -->
    <path d="M 138 150 L 165 130 L 165 365 L 138 385 Z" fill="url(#blueSideGrad)" />
    <!-- Blue Vertical Stem - Front Face Pillar -->
    <rect x="165" y="130" width="82" height="235" rx="3" fill="url(#blueFrontGrad)" stroke="#93c5fd" stroke-width="1" stroke-opacity="0.6" />
    <!-- Blue Vertical Stem - Bottom 3D Facet -->
    <path d="M 138 385 L 165 365 L 247 365 L 220 385 Z" fill="url(#blueSideGrad)" />

    <!-- 3D Yellow Interlocking C Structure -->
    <!-- C Top Horizontal Arm -->
    <path d="M 247 140 L 390 140 L 390 220 L 325 220 L 325 185 L 247 185 Z" fill="url(#yellowFrontGrad)" />
    <path d="M 225 155 L 247 140 L 390 140 L 370 155 Z" fill="url(#yellowTopGrad)" />

    <!-- C Main Body Right Arch Curve -->
    <path d="M 247 140 Q 200 140 200 260 Q 200 380 320 380 L 395 380 L 395 285 L 330 285 Q 280 285 280 260 Q 280 230 330 230 L 330 140 Z" fill="url(#yellowFrontGrad)" />
    
    <!-- C 3D Left/Bottom Extrusions & Real-world Depth -->
    <path d="M 200 260 L 180 280 Q 180 405 300 405 L 395 405 L 395 380 L 320 380 Q 200 380 200 260 Z" fill="url(#yellowSideGrad)" />
    <!-- C Gap/Notch on Bottom Arm -->
    <path d="M 330 285 L 350 265 L 395 265 L 395 285 Z" fill="url(#yellowSideGrad)" />
    <path d="M 320 380 L 300 405 L 395 405 L 395 380 Z" fill="url(#yellowSideGrad)" />

    <!-- Blue Lower Loop Interlocking Return Piece -->
    <path d="M 255 250 L 315 250 Q 350 250 350 270 L 325 270 Q 325 260 295 260 L 255 260 Z" fill="url(#blueFrontGrad)" />
  </g>
</svg>
